name: Reusable Terraform EB Deploy

on:
  workflow_call:
    inputs:
      terraform_version:
        type: string
        default: '1.11.3'
      aws_region:
        description: 'AWS Region (deve combaciare con VPC/subnets/certificate)'
        type: string
        default: 'eu-west-1'
      working_directory:
        type: string
        default: 'src/main/webapp/resources/IaaC'

      # --- Nomi (vuoti = nome del repo) ---
      eb_env_name:
        description: 'EB environment name. Vuoto => nome del repo.'
        type: string
        default: ''
        required: false
      eb_app_name:
        description: 'EB application name. Vuoto => nome del repo.'
        type: string
        default: ''
        required: false
      project_tag:
        description: 'Tag PROJECT e prefisso WAF/ruolo. Vuoto => nome repo.'
        type: string
        default: ''
        required: false

      # --- Account-specifici (OBBLIGATORI) ---
      vpc_id:
        type: string
        required: true
      subnets:
        type: string
        required: true
      ssl_certificate_arn:
        type: string
        required: true

      # --- Sicurezza apply ---
      allow_destroy:
        description: 'Se false (default) il deploy si ferma quando il plan contiene destroy/replace.'
        type: boolean
        default: false
      plan_only:
        description: 'Se true esegue solo il plan (nessun apply).'
        type: boolean
        default: false

      # --- Piattaforma (Java 21 / Tomcat 10 standard) ---
      java_version:
        type: string
        default: '21'
      tomcat_family:
        description: 'Famiglia Tomcat da cercare nel solution stack.'
        type: string
        default: 'Tomcat 10'

      # --- Knobs opzionali ---
      instance_type:
        type: string
        default: 't4g.small'
      instance_architecture:
        type: string
        default: 'arm64'
      min_size:
        type: string
        default: '1'
      max_size:
        type: string
        default: '1'
      health_check_path:
        type: string
        default: '/services/health/check'

      # --- Build/deploy passthrough ---
      node_version:
        type: string
        default: '22.18.0'
      npm_version:
        type: string
        default: '10.9.3'
      maven_version:
        type: string
        default: '3.9.12'
      maven_profile:
        type: string
        default: 'prod'
      log-group-prefix:
        required: false
        type: string
      root-war-url:
        required: false
        type: string
        default: ''
      loader-io-token:
        required: false
        type: string
        default: ''
      force-lowercase-app-name:
        required: false
        type: boolean
        default: false
      force-root-app-name:
        required: false
        type: boolean
        default: false

    secrets:
      AWS_ROLE_TO_ASSUME_FOR_DEPLOY:
        description: 'IAM Role ARN for OIDC authentication'
        required: true

jobs:

  resolve-account-id:
    runs-on: ubuntu-latest
    outputs:
      account_id: ${{ steps.whoami.outputs.account_id }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_FOR_DEPLOY }}
          aws-region: ${{ inputs.aws_region }}
      - name: Get AWS Account ID
        id: whoami
        run: echo "account_id=$(aws sts get-caller-identity --region ${{ inputs.aws_region }} --query Account --output text)" >> $GITHUB_OUTPUT

  configure-elastic-beanstalk-enviroments:
      needs: resolve-account-id
      runs-on: ubuntu-latest
      outputs:
        eb_app_name: ${{ steps.resolve.outputs.app_name }}
        eb_env_name: ${{ steps.resolve.outputs.env_name }}
      permissions:
        id-token: write
        contents: read
      steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_FOR_DEPLOY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Ensure S3 bucket exists for terraform states (create once, reuse after)
        env:
          ACCOUNT_ID: ${{ needs.resolve-account-id.outputs.account_id }}
        run: |
          set -e
          REPO_LC="${{ github.event.repository.name }}"; REPO_LC="${REPO_LC,,}"
          BUCKET_NAME="terraform-${REPO_LC}-state-${ACCOUNT_ID}"
          echo "Terraform state bucket: $BUCKET_NAME"
          for i in $(seq 1 10); do
            OUT=$(aws s3api create-bucket --bucket "$BUCKET_NAME" --region "${{ inputs.aws_region }}" \
                  --create-bucket-configuration LocationConstraint="${{ inputs.aws_region }}" 2>&1) && { echo "Created."; break; }
            if echo "$OUT" | grep -q "BucketAlreadyOwnedByYou"; then echo "Already owned. Reusing."; break
            elif echo "$OUT" | grep -q "OperationAborted"; then echo "Conflict, retry $i..."; sleep 15
            elif echo "$OUT" | grep -q "BucketAlreadyExists"; then echo "ERROR: name taken by another account" >&2; exit 1
            else echo "$OUT" >&2; exit 1; fi
            [ "$i" -eq 10 ] && { echo "ERROR: bucket not ready" >&2; exit 1; }
          done

      - name: Resolve Terraform variables
        id: resolve
        env:
          IN_APP: ${{ inputs.eb_app_name }}
          IN_ENV: ${{ inputs.eb_env_name }}
          IN_PROJECT: ${{ inputs.project_tag }}
        run: |
          set -e
          REPO="${{ github.event.repository.name }}"
          APP="${IN_APP:-$REPO}"
          ENVN="${IN_ENV:-$REPO}"
          PROJECT="${IN_PROJECT:-$REPO}"
          EC2_ROLE="${PROJECT}-eb-ec2-role"

          {
            echo "TF_VAR_aws_region=${{ inputs.aws_region }}"
            echo "TF_VAR_application_name=$APP"
            echo "TF_VAR_environment_name=$ENVN"
            echo "TF_VAR_project_tag=$PROJECT"
            echo "TF_VAR_ec2_role_name=$EC2_ROLE"
            echo "TF_VAR_vpc_id=${{ inputs.vpc_id }}"
            echo "TF_VAR_subnets=${{ inputs.subnets }}"
            echo "TF_VAR_ssl_certificate_arn=${{ inputs.ssl_certificate_arn }}"
            echo "TF_VAR_instance_type=${{ inputs.instance_type }}"
            echo "TF_VAR_instance_architecture=${{ inputs.instance_architecture }}"
            echo "TF_VAR_min_size=${{ inputs.min_size }}"
            echo "TF_VAR_max_size=${{ inputs.max_size }}"
            echo "TF_VAR_health_check_path=${{ inputs.health_check_path }}"
            echo "RESOLVED_APP_NAME=$APP"
            echo "RESOLVED_ENV_NAME=$ENVN"
            echo "RESOLVED_PROJECT=$PROJECT"
            echo "RESOLVED_EC2_ROLE=$EC2_ROLE"
          } >> "$GITHUB_ENV"

          echo "app_name=$APP" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENVN" >> "$GITHUB_OUTPUT"
          echo "Resolved: app=$APP env=$ENVN project=$PROJECT ec2_role=$EC2_ROLE region=${{ inputs.aws_region }}"

      - name: Make Terraform S3 backend dynamic in main.tf
        working-directory: ${{ inputs.working_directory }}
        env:
          ACCOUNT_ID: ${{ needs.resolve-account-id.outputs.account_id }}
        run: |
          set -e
          [ -f main.tf ] || { echo "ERROR: main.tf non trovato in ${{ inputs.working_directory }}" >&2; exit 1; }
          REPO_LC="${{ github.event.repository.name }}"; REPO_LC="${REPO_LC,,}"
          BUCKET_NAME="terraform-${REPO_LC}-state-${ACCOUNT_ID}"
          REGION="${{ inputs.aws_region }}"
          echo "Backend -> bucket=$BUCKET_NAME region=$REGION"
          sed -i -E "/backend[[:space:]]+\"s3\"[[:space:]]*\{/,/\}/ {
            s|^([[:space:]]*)bucket[[:space:]]*=.*|\1bucket = \"${BUCKET_NAME}\"|
            s|^([[:space:]]*)region[[:space:]]*=.*|\1region = \"${REGION}\"|
          }" main.tf
          grep -n -A6 -E 'backend[[:space:]]+"s3"' main.tf || true

      - name: Resolve Elastic Beanstalk solution stack
        run: |
          set -e
          FILTER_TOMCAT="${{ inputs.tomcat_family }}"
          FILTER_CORRETTO="Corretto ${{ inputs.java_version }}"
          STACK=$(aws elasticbeanstalk list-available-solution-stacks --region "${{ inputs.aws_region }}" \
            --query "SolutionStacks[?contains(@, 'Amazon Linux 2023') && contains(@, '$FILTER_TOMCAT') && contains(@, '$FILTER_CORRETTO')] | [0]" \
            --output text)
          if [ -z "$STACK" ] || [ "$STACK" = "None" ]; then
            echo "ERROR: nessun solution stack AL2023 / $FILTER_TOMCAT / $FILTER_CORRETTO in ${{ inputs.aws_region }}" >&2
            aws elasticbeanstalk list-available-solution-stacks --region "${{ inputs.aws_region }}" \
              --query "SolutionStacks[?contains(@, 'Tomcat')]" --output table >&2 || true
            exit 1
          fi
          echo "Solution stack: $STACK"
          echo "TF_VAR_solution_stack_name=$STACK" >> "$GITHUB_ENV"

      - name: Extract S3 backend info from Terraform (safe)
        working-directory: ${{ inputs.working_directory }}
        id: s3info
        run: |
          set -e
          [ -f main.tf ] || { echo "Errore: main.tf non trovato!"; exit 1; }
          terraform init -input=false -reconfigure
          STATE_FILE=".terraform/terraform.tfstate"
          [ -f "$STATE_FILE" ] || { echo "Errore: backend state non trovato"; exit 1; }
          echo "bucket=$(jq -r '.backend.config.bucket' "$STATE_FILE")" >> $GITHUB_OUTPUT
          echo "key=$(jq -r '.backend.config.key' "$STATE_FILE")" >> $GITHUB_OUTPUT
          echo "region=$(jq -r '.backend.config.region' "$STATE_FILE")" >> $GITHUB_OUTPUT

      - name: Ensure S3 bucket exists for ebt-deployments artifacts (create once, reuse after)
        env:
          ACCOUNT_ID: ${{ needs.resolve-account-id.outputs.account_id }}
        run: |
          set -e
          REPO_LC="${{ github.event.repository.name }}"; REPO_LC="${REPO_LC,,}"
          BUCKET_NAME="${REPO_LC}-ebt-deployments-${ACCOUNT_ID}"
          echo "EBT deployments bucket: $BUCKET_NAME"
          for i in $(seq 1 10); do
            OUT=$(aws s3api create-bucket --bucket "$BUCKET_NAME" --region "${{ inputs.aws_region }}" \
                  --create-bucket-configuration LocationConstraint="${{ inputs.aws_region }}" 2>&1) && { echo "Created."; break; }
            if echo "$OUT" | grep -q "BucketAlreadyOwnedByYou"; then echo "Already owned. Reusing."; break
            elif echo "$OUT" | grep -q "OperationAborted"; then echo "Conflict, retry $i..."; sleep 15
            elif echo "$OUT" | grep -q "BucketAlreadyExists"; then echo "ERROR: name taken by another account" >&2; exit 1
            else echo "$OUT" >&2; exit 1; fi
            [ "$i" -eq 10 ] && { echo "ERROR: bucket not ready" >&2; exit 1; }
          done

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -input=false -reconfigure

      # --- Import self-healing + anti-rename + migrazione IAM per-progetto ---
      - name: Terraform import & reconcile state
        working-directory: ${{ inputs.working_directory }}
        env:
          REGION: ${{ inputs.aws_region }}
        run: |
          set -uo pipefail

          # id corrente di una risorsa nello state (vuoto se assente)
          state_id() { terraform state show "$1" 2>/dev/null | awk -F'"' '/^[[:space:]]*id[[:space:]]*=/{print $2; exit}'; }
          in_state()  { terraform state list 2>/dev/null | grep -qx "$1"; }

          # rimuove dallo state (senza distruggere in AWS) se l'id non combacia con quello desiderato
          rm_if_mismatch() {
            local addr="$1" desired="$2"
            if in_state "$addr"; then
              local cur; cur=$(state_id "$addr")
              if [ "$cur" != "$desired" ]; then
                echo "Reconcile $addr: '$cur' != '$desired' -> state rm (non distrutto in AWS)"
                terraform state rm "$addr" || true
              fi
            fi
          }

          # ---- Migrazione IAM: da ruolo condiviso a ruolo per-progetto ----
          # Se lo state ha il ruolo con un nome diverso da quello desiderato,
          # rimuove TUTTI i 5 oggetti IAM dallo state (NON li distrugge) cosi'
          # il plan crea quelli per-progetto senza toccare il ruolo condiviso.
          if in_state aws_iam_role.eb_ec2_role; then
            CUR_ROLE=$(state_id aws_iam_role.eb_ec2_role)
            if [ "$CUR_ROLE" != "$RESOLVED_EC2_ROLE" ]; then
              echo "Migrazione IAM: '$CUR_ROLE' -> '$RESOLVED_EC2_ROLE'"
              for a in aws_iam_role.eb_ec2_role aws_iam_instance_profile.eb_ec2_instance_profile \
                       aws_iam_role_policy.eb_ec2_cloudwatch_logs \
                       aws_iam_role_policy_attachment.eb_ec2_role_attach \
                       aws_iam_role_policy_attachment.eb_ec2_worker_attach; do
                terraform state rm "$a" || true
              done
            fi
          fi
          # Import per-progetto SOLO se il ruolo esiste gia' (run successivi); altrimenti verra' creato
          if aws iam get-role --role-name "$RESOLVED_EC2_ROLE" --region "$REGION" >/dev/null 2>&1; then
            terraform import aws_iam_role.eb_ec2_role "$RESOLVED_EC2_ROLE" || true
            terraform import aws_iam_instance_profile.eb_ec2_instance_profile "$RESOLVED_EC2_ROLE" || true
            terraform import aws_iam_role_policy.eb_ec2_cloudwatch_logs "$RESOLVED_EC2_ROLE:EBCloudWatchLogsPolicy" || true
            terraform import aws_iam_role_policy_attachment.eb_ec2_role_attach "$RESOLVED_EC2_ROLE/arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier" || true
            terraform import aws_iam_role_policy_attachment.eb_ec2_worker_attach "$RESOLVED_EC2_ROLE/arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier" || true
          else
            echo "IAM role $RESOLVED_EC2_ROLE assente: verra' creato dal plan."
          fi

          # ---- WAF regex pattern sets ----
          import_regex_set() {
            local tfaddr="$1" name="$2" id
            id=$(aws wafv2 list-regex-pattern-sets --scope REGIONAL --region "$REGION" \
                  --query "RegexPatternSets[?Name=='$name'].Id | [0]" --output text)
            if [ -n "$id" ] && [ "$id" != "None" ]; then
              rm_if_mismatch "$tfaddr" "$id"
              in_state "$tfaddr" || terraform import "$tfaddr" "$id/$name/REGIONAL" || true
            else echo "Regex set $name assente: skip."; fi
          }
          import_regex_set aws_wafv2_regex_pattern_set.valid_http_methods   allowed-http-methods
          import_regex_set aws_wafv2_regex_pattern_set.blocked_http_methods http-methods-blocked
          import_regex_set aws_wafv2_regex_pattern_set.path_services        allowed-path-prefix-services

          # ---- WAF Web ACL ----
          ACL_NAME="eb-waf-${RESOLVED_PROJECT}"
          ACL_ID=$(aws wafv2 list-web-acls --scope REGIONAL --region "$REGION" \
                    --query "WebACLs[?Name=='$ACL_NAME'].Id | [0]" --output text)
          if [ -n "$ACL_ID" ] && [ "$ACL_ID" != "None" ]; then
            rm_if_mismatch aws_wafv2_web_acl.waf "$ACL_ID"
            in_state aws_wafv2_web_acl.waf || terraform import aws_wafv2_web_acl.waf "$ACL_ID/$ACL_NAME/REGIONAL" || true
          else echo "Web ACL $ACL_NAME assente: skip."; fi

          # ---- EB Application (anti-rename) ----
          if aws elasticbeanstalk describe-applications --application-names "$RESOLVED_APP_NAME" --region "$REGION" \
               --query "Applications[0].ApplicationName" --output text 2>/dev/null | grep -qx "$RESOLVED_APP_NAME"; then
            rm_if_mismatch aws_elastic_beanstalk_application.app "$RESOLVED_APP_NAME"
            in_state aws_elastic_beanstalk_application.app || terraform import aws_elastic_beanstalk_application.app "$RESOLVED_APP_NAME" || true
          else echo "EB application $RESOLVED_APP_NAME assente: verra' creata."; fi

          # ---- EB Environment (anti-rename, id = e-xxxx) ----
          ENV_ID=$(aws elasticbeanstalk describe-environments --environment-names "$RESOLVED_ENV_NAME" --region "$REGION" \
                    --query "Environments[?Status!='Terminated'].EnvironmentId | [0]" --output text)
          if [ -n "$ENV_ID" ] && [ "$ENV_ID" != "None" ]; then
            rm_if_mismatch aws_elastic_beanstalk_environment.env "$ENV_ID"
            in_state aws_elastic_beanstalk_environment.env || terraform import aws_elastic_beanstalk_environment.env "$ENV_ID" || true
          else echo "EB environment $RESOLVED_ENV_NAME assente: verra' creato."; fi

          # ---- WAF association ----
          if [ -n "${ACL_ID:-}" ] && [ "$ACL_ID" != "None" ] && [ -n "${ENV_ID:-}" ] && [ "$ENV_ID" != "None" ]; then
            ACL_ARN=$(aws wafv2 list-web-acls --scope REGIONAL --region "$REGION" \
                       --query "WebACLs[?Name=='$ACL_NAME'].ARN | [0]" --output text)
            LB_ARN=$(aws elasticbeanstalk describe-environment-resources --environment-name "$RESOLVED_ENV_NAME" --region "$REGION" \
                       --query "EnvironmentResources.LoadBalancers[0].Name" --output text)
            if [ -n "$ACL_ARN" ] && [ "$ACL_ARN" != "None" ] && [ -n "$LB_ARN" ] && [ "$LB_ARN" != "None" ]; then
              in_state aws_wafv2_web_acl_association.waf || terraform import aws_wafv2_web_acl_association.waf "${ACL_ARN},${LB_ARN}" || true
            fi
          fi

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "Planning app=$RESOLVED_APP_NAME env=$RESOLVED_ENV_NAME"
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json

      - name: Guard against destructive changes
        working-directory: ${{ inputs.working_directory }}
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          set -e
          DESTRUCTIVE=$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address): \(.change.actions | join("+"))"' tfplan.json)
          if [ -n "$DESTRUCTIVE" ]; then
            echo "::warning title=Azioni distruttive rilevate::destroy/replace nel plan"
            echo "----- DESTROY / REPLACE -----"
            echo "$DESTRUCTIVE"
            echo "-----------------------------"
            if [ "$ALLOW_DESTROY" != "true" ]; then
              echo "::error::Apply BLOCCATO: il plan distruggerebbe/ricreerebbe risorse. Verifica sopra. Rilancia con allow_destroy=true SOLO se intenzionale."
              exit 1
            fi
            echo "allow_destroy=true: procedo comunque."
          else
            echo "Nessuna azione distruttiva: OK."
          fi

      - name: Terraform Apply
        if: ${{ inputs.plan_only == false }}
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -input=false tfplan

  wait-for-ready-enviroment:
    needs: configure-elastic-beanstalk-enviroments
    if: ${{ inputs.plan_only == false }}
    runs-on: ubuntu-latest
    outputs:
      eb_env_name: ${{ needs.configure-elastic-beanstalk-enviroments.outputs.eb_env_name }}
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_FOR_DEPLOY }}
        aws-region: ${{ inputs.aws_region }}

    - name: Wait for Elastic Beanstalk environment to be ready
      env:
        ENV_NAME: ${{ needs.configure-elastic-beanstalk-enviroments.outputs.eb_env_name }}
        REGION: ${{ inputs.aws_region }}
      run: |
          echo "Waiting for EB environment: $ENV_NAME"
          version_label=$(aws elasticbeanstalk describe-environments --environment-names "$ENV_NAME" --region "$REGION" \
            --query "Environments[0].VersionLabel" --output text)
          if [[ "$version_label" == "Sample Application" || "$version_label" == "None" ]]; then
            echo "Sample app / nessuna versione: skip wait."; exit 0
          fi
          for i in $(seq 1 30); do
            status=$(aws elasticbeanstalk describe-environments --environment-names "$ENV_NAME" --region "$REGION" --query "Environments[0].Status" --output text)
            health=$(aws elasticbeanstalk describe-environments --environment-names "$ENV_NAME" --region "$REGION" --query "Environments[0].Health" --output text)
            echo "Attempt $i: Status=$status Health=$health"
            if [ "$status" = "Ready" ] && { [ "$health" = "Green" ] || [ "$health" = "Ok" ]; }; then echo "Ready."; exit 0; fi
            sleep 10
          done
          exit 1

  prepare-bucket-name:
    needs: resolve-account-id
    if: ${{ inputs.plan_only == false }}
    runs-on: ubuntu-latest
    outputs:
      s3_bucket_name: ${{ steps.out.outputs.bucket }}
    steps:
      - id: out
        env:
          ACCOUNT_ID: ${{ needs.resolve-account-id.outputs.account_id }}
        run: |
          REPO_LC="${{ github.event.repository.name }}"; REPO_LC="${REPO_LC,,}"
          echo "bucket=${REPO_LC}-ebt-deployments-${ACCOUNT_ID}" >> $GITHUB_OUTPUT

  call-build-and-deploy:
    needs:
      - wait-for-ready-enviroment
      - configure-elastic-beanstalk-enviroments
      - prepare-bucket-name
    if: ${{ inputs.plan_only == false }}
    permissions:
      id-token: write
      contents: read
    uses: OneClickApp-by-LOGCONSULTING/wm-elasticbeanstalk-publisher/.github/workflows/ebt-deployer.yml@main
    secrets:
       AWS_ROLE_TO_ASSUME_FOR_DEPLOY: ${{ secrets.AWS_ROLE_TO_ASSUME_FOR_DEPLOY }}
    with:
      node-version: ${{ inputs.node_version }}
      npm-version: ${{ inputs.npm_version }}
      maven-version: ${{ inputs.maven_version }}
      java-version: ${{ inputs.java_version }}
      aws-region: ${{ inputs.aws_region }}
      environment-name: ${{ needs.wait-for-ready-enviroment.outputs.eb_env_name }}
      wm-app-name: ${{ github.event.repository.name }}
      beanstalk-application-name: ${{ needs.configure-elastic-beanstalk-enviroments.outputs.eb_app_name }}
      wm-profile: ${{ inputs.maven_profile }}
      aws-s3-bucket-name: ${{ needs.prepare-bucket-name.outputs.s3_bucket_name }}
      aws-s3-bucket-region: ${{ inputs.aws_region }}
      force-lowercase-wm-app-name: ${{ inputs.force-lowercase-app-name }}
      log-group-prefix: ${{ github.event.repository.name }}
      force-root-wm-app-name: ${{ inputs.force-root-app-name }}
